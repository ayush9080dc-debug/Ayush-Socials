<style>
:root{
  --bg:#f6f1fb;--ink:#241f3a;--mute:#6b6585;--card:#ffffff;--line:#ded5ee;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142a;--ink:#f1ecfb;--mute:#a59fc0;--card:#221e3d;--line:#38325c}}
:root[data-theme="dark"]{--bg:#17142a;--ink:#f1ecfb;--mute:#a59fc0;--card:#221e3d;--line:#38325c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "DM Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:56px 20px 72px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(44px,11vw,84px);line-height:.98;font-weight:700}
.tag{color:var(--mute);margin:14px 0 20px;max-width:46ch;font-size:18px}
.links{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0 0 44px;list-style:none}
.links a{display:block;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:500}
.links a:hover{border-color:var(--ink)}
a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.shelf{margin:0 0 36px}
.shelf h2{font-size:26px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.item{margin:0;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.item b{display:block;font:700 16px/1.2 "Bricolage Grotesque",sans-serif}
.item.pic{position:relative;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;border:0;color:#fff;background-size:cover;background-position:center 30%;overflow:hidden}
.item.pic::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,25,.85),rgba(10,8,25,.1) 60%)}
.item.pic b,.item.pic span{position:relative;color:#fff}
.item span{display:block;margin-top:4px;color:var(--mute);font-size:13px}
footer{margin-top:56px;color:var(--mute);font-size:14px}
@media (max-width:560px){.row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

</main>

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };

document.title = SITE.name + " — My favorites";
$("name").textContent = SITE.name;
$("tagline").textContent = SITE.tagline;
$("foot").textContent = SITE.footer;

SITE.links.forEach(l => {
  const li = el("li"), a = el("a", "", l.label);
  a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  li.appendChild(a); $("links").appendChild(li);
});

SITE.favorites.forEach(shelf => {
  const sec = el("section", "shelf"); sec.appendChild(el("h2", "", shelf.title));
  const row = el("div", "row");
  shelf.items.forEach(it => {
    const f = el("figure", it.img ? "item pic" : "item");
    if (it.img) f.style.backgroundImage = "url('" + it.img + "')";
    if (it.pos) f.style.backgroundPosition = it.pos;
    f.append(el("b", "", it.name), el("span", "", it.note));
    row.appendChild(f);
  });
  sec.appendChild(row); $("favs").appendChild(sec);
});
</script>
